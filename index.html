<html>
  <head>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <title>Libs&Frames</title>
    <style>
      body {
        background: #fafafa;
        color: #000;
        font-family: Roboto, Arial, Verdana, sans-serif;
        margin: 0px;
        height: 500px;
      }

      .nav-bar {
        visibility: hidden;
        background: #ffffffaa;
        height: 30px;
        width: 500px;
        position: sticky;
        align-content: center;
        padding: 5px 30px;
        top: 5px;
        border-radius: 20px;
        border: 1.5px solid #00000009;
        margin: 0 auto;
        z-index: 1000;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }
      
      .navbar-title-glided {
        visibility: visible;
      }
      
      app {
        display: flex;
        flex-direction: column;
        margin: 20px;
        align-items: center;
      }

      .libsnframes-title {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        transition: all 0.2s ease;
      }
      
      .libsnframes-title-glided {
        position: fixed;
        top: 6.5px;
        transform: translateX(-265%);
        font-size: 16px;
        font-weight: bold;
        width: auto;
        z-index: 1001;
      }
      
      .libsnframes-title-subtitle {
        visibility: visible;
        font-size: 12.5px;
        position: absolute;
        left: 50%;
        font-weight: 300;
        color: #00000077;
        transform: translateX(-50%)translateY(275%);
        transition: all 0.2s ease;
      }
      
      .libsnframes-title-subtitle-glided {
        visibility: hidden;
        position: fixed;
        top: 26px;
        transform: translateX(-300%);
        font-size: 6.25px;
        width: auto;
        z-index: 1001;
      }
    </style>
  </head>
  <body>
    <div class="nav-bar"><strong style="color: #00000000"> Libs&Frames </strong></div>
    <app>
        <h1 class="libsnframes-title">Libs&Frames</h1>
        <h3 class="libsnframes-title-subtitle">Free libraries and frameworks</h3>
    </app>
    <script>
    
    </script>
    <script>
    const title = document.querySelector('.libsnframes-title');
    const titlesubtitle = document.querySelector('.libsnframes-title-subtitle');
    const navbar = document.querySelector('.nav-bar');
    const triggerPoint = title.offsetTop;

    window.addEventListener('scroll', () => {
      if (window.scrollY >= triggerPoint - 10) {
        title.classList.add('libsnframes-title-glided');
        titlesubtitle.classList.add('libsnframes-title-subtitle-glided');
        navbar.classList.add('navbar-title-glided');
      } else {
        title.classList.remove('libsnframes-title-glided');
        titlesubtitle.classList.remove('libsnframes-title-subtitle-glided');
        navbar.classList.remove('navbar-title-glided');
      }
    });
  </script>
  </body>
</html>
